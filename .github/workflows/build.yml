name: Build Binaries

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install colorama pyinstaller

      - name: Inject version info
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::7}
          BUILD=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/__version__ = \"dev\"/__version__ = \"$VERSION\"/" sha3sum.py
          sed -i "s/__commit__  = \"unknown\"/__commit__  = \"$COMMIT\"/" sha3sum.py
          sed -i "s/__build__   = \"local\"/__build__   = \"$BUILD\"/" sha3sum.py

      - name: Build binary
        run: python -m PyInstaller --onefile --clean --hidden-import colorama sha3sum.py

      - name: Verify binary
        run: |
          file dist/sha3sum
          ./dist/sha3sum --version

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha3sum-linux
          path: dist/sha3sum

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install colorama pyinstaller

      - name: Inject version info
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::7}
          BUILD=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/__version__ = \"dev\"/__version__ = \"$VERSION\"/" sha3sum.py
          sed -i "s/__commit__  = \"unknown\"/__commit__  = \"$COMMIT\"/" sha3sum.py
          sed -i "s/__build__   = \"local\"/__build__   = \"$BUILD\"/" sha3sum.py

      - name: Build EXE
        run: python -m PyInstaller --onefile --clean --hidden-import colorama sha3sum.py

      - name: Verify EXE
        run: .\dist\sha3sum.exe --version

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha3sum-windows
          path: dist/sha3sum.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: sha3sum-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: sha3sum-windows
          path: artifacts/windows

      - name: Prepare artifacts
        run: |
          mv artifacts/linux/sha3sum       artifacts/sha3sum
          mv artifacts/windows/sha3sum.exe artifacts/sha3sum.exe
          chmod +x artifacts/sha3sum

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## sha3sum ${{ github.ref_name }}

            ### Download
            | Platform | File |NOTE|
            |----------|------|-------------------------|
            | Linux (x64) | `sha3sum` | `sha3sum-linux-amd64` |
            | Windows (x64) | `sha3sum.exe` | `sha3sum-windows-amd64` |

            ### Verify
            ```bash
            # Check version + commit SHA
            ./sha3sum --version
            ```

            ### Usage
            ```bash
            # Linux
            chmod +x sha3sum
            ./sha3sum file.iso
            ./sha3sum file.iso -a sha3_512
            ./sha3sum file.iso -a blake2b -c "abc123..."

            # Windows
            sha3sum.exe file.iso
            sha3sum.exe file.iso -a sha3_512
            ```
          files: |
            artifacts/sha3sum
            artifacts/sha3sum.exe
          draft: false
          prerelease: false